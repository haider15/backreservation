name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    # Configuration de Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    # Connexion à Docker Hub avec tes informations d'identification
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}  # Utilise le secret DockerHub username
        password: ${{ secrets.DOCKERHUB_TOKEN }}     # Utilise le secret DockerHub token

    # Construction et push de l'image pour chaque microservice
    - name: Build and push user-service Docker image
      uses: docker/build-push-action@v2
      with:
        context: ./user-service  # Répertoire où se trouve ton Dockerfile pour le service utilisateur
        push: true
        tags: haider693/user-service:latest  # Tag de l'image Docker sur DockerHub

    - name: Build and push salle-service Docker image
      uses: docker/build-push-action@v2
      with:
        context: ./salle-service  # Répertoire où se trouve ton Dockerfile pour le service salle
        push: true
        tags: haider693/salle-service:latest  # Tag de l'image Docker sur DockerHub

    - name: Build and push reservation-service Docker image
      uses: docker/build-push-action@v2
      with:
        context: ./reservation-service  # Répertoire où se trouve ton Dockerfile pour le service réservation
        push: true
        tags: haider693/reservation-service:latest  # Tag de l'image Docker sur DockerHub

    - name: Logout from Docker Hub
      run: docker logou
      #////////////////
  sonarQubeAnalysis:
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install dependencies
      run: npm install

    - name: Set up SonarQube scanner
      uses: SonarSource/sonar-scanner-action@v2
      with:
        sonar-token: ${{ secrets.SONAR_TOKEN }}  # Ton token SonarQube
        sonar-project-key: 'nodejs-project'
        sonar-project-name: 'Node.js Project'
        sonar-project-version: '1.0'
        sonar-host-url: 'http://your-sonarqube-instance:9000'  # Remplace par l'URL de ton SonarQube

    - name: Run SonarQube scanner
      run: sonar-scanner





  deploy-to-kubernetes:
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    # Installer Helm
    - name: Set up Helm
      uses: azure/setup-helm@v1

    # Installer kubectl
    - name: Set up kubectl
      uses: azure/setup-kubectl@v1
      with:
        kubectl-version: 'latest'

    # Configurer kubeconfig (assurez-vous d'avoir les secrets Kubernetes)
    - name: Configure kubeconfig
      run: |
        mkdir -p $HOME/.kube  # Crée le répertoire .kube
        echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config  # Assurez-vous que ce secret existe dans votre dépôt GitHub

    # Déployer avec Helm
    - name: Helm Upgrade/Install
      run: |
        helm upgrade --install user-service ./helm/user-service --namespace default --set image.repository=haider693/user-service,image.tag=latest
        helm upgrade --install salle-service ./helm/salle-service --namespace default --set image.repository=haider693/salle-service,image.tag=latest
        helm upgrade --install reservation-service ./helm/reservation-service --namespace default --set image.repository=haider693/reservation-service,image.tag=latest