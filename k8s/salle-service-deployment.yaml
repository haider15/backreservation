apiVersion: apps/v1
kind: Deployment
metadata:
  name: salle-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: salle-service
  template:
    metadata:
      labels:
        app: salle-service
    spec:
      containers:
        - name: salle-service
          image: ton-dockerhub/salle-service:latest
          ports:
            - containerPort: 3002
          env:
            - name: DB_HOST
              value: mysql
            - name: KAFKA_BROKER
              value: kafka:9092
