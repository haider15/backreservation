apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ton-dockerhub/user-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: DB_HOST
              value: mysql
            - name: KAFKA_BROKER
              value: kafka:9092
