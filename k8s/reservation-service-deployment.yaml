apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reservation-service
  template:
    metadata:
      labels:
        app: reservation-service
    spec:
      containers:
        - name: reservation-service
          image: ton-dockerhub/reservation-service:latest
          ports:
            - containerPort: 3003
          env:
            - name: DB_HOST
              value: mysql
            - name: KAFKA_BROKER
              value: kafka:9092
